# Thí nghiệm retrieval (Ngày 2). Mục không ghi lấy mặc định = baseline (xem my_pipeline.py).
# Chạy: NEORAG_PIPELINE_CONFIG=configs/experiments/<file> neorag run train --no-judge --pipeline neorag.pipelines.my_pipeline:MyPipeline --out outputs/<tên>_pred.jsonl

[retrieval]
method = "hybrid"

[bm25]
fold_accents = true

[rewrite]
enabled = true

[reranker]
enabled = true
top_n = 10  # giảm số cặp phải chấm để giảm latency
num_threads = 4  # i7-12800H: chỉ dùng P-core nhanh hơn dùng cả E-core

[generation]
enabled = false  # chỉ đo retrieval
